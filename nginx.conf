server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header_inherit merge;

    location = / {
        return 302 /thoughts/;
    }

    location = /thoughts {
        return 308 /thoughts/;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /thoughts/data/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /thoughts/cards/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /thoughts/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /thoughts/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /thoughts/index.html;
    }
}
