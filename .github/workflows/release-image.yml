name: release-image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify source
        run: |
          npm ci --ignore-scripts
          npm test
          npm run lint
          npm run build

      - name: Verify container routes
        run: |
          docker build --tag cosmic-filament:smoke .
          docker run --detach --name cosmic-filament-smoke --publish 127.0.0.1:18081:8080 cosmic-filament:smoke
          trap 'docker rm --force cosmic-filament-smoke' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18081/healthz && break
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/thoughts)" = 308
          test "$(curl --silent --head http://127.0.0.1:18081/thoughts | tr -d '\r' | awk '/^[Ll]ocation:/ {print $2}')" = /thoughts/
          curl --fail --silent http://127.0.0.1:18081/thoughts/ >/dev/null

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
